# Dependency updates.
#
# Grouped and rate-limited on purpose. A solo maintainer drowning in twelve
# separate PRs a week stops reading them, and an unread security PR is worth
# less than no PR at all. Security updates are always raised individually and
# immediately; routine version bumps arrive batched, weekly.
version: 2

updates:
  # ─── Frontend (Next.js / React) ───────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Next, React and their types move together or not at all — bumping one
      # without the others is how a build breaks.
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # ─── Backend (FastAPI / LangGraph) ────────────────────────────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    # ─── Packages Dependabot must not raise ─────────────────────────────────
    ignore:
      # websockets: CAPPED BY TWO DEPENDENCIES, NOT BY PREFERENCE.
      #
      #   google-genai 2.22.0 requires websockets<17.0
      #   realtime     2.31.0 requires websockets<16     (Supabase Realtime)
      #
      # realtime is the binding one, so >=13.0,<16.0 in requirements.txt is
      # already the highest installable version. Dependabot opened
      # `websockets>=17.1,<18.0` anyway — it reads the constraint in our file,
      # not the ones in our dependencies' metadata. Merging it is not risky,
      # it is IMPOSSIBLE: pip answers ResolutionImpossible, and if it somehow
      # resolved it would take out cv_parser, jd_analyzer and the fact
      # checker, all of which run on google-genai.
      #
      # Remove this ONLY after checking that both packages have raised their
      # ceilings — `pip index versions` will not tell you; read their
      # requires_dist on PyPI.
      - dependency-name: websockets

      # python-minor-patch (the group below used to catch everything not
      # named above) is REJECTED, not just trimmed. Its last PR (#22, "Bump
      # the python-minor-patch group across 1 directory with 60 updates")
      # bundled google-api-core -> 2.36.0 without protobuf, and
      # pydantic-core -> 2.48.0 without a matching pydantic — both
      # ResolutionImpossible, both silent inside a 60-package diff nobody
      # could review line by line. It shipped anyway: merged by hand with
      # the two pins fixed (see the "Merge the python-minor-patch group,
      # with the two pins Dependabot got wrong" commit), which is the
      # problem, not the fix — catching a THIRD undiscovered coupling the
      # same way, by hand, in a 60-line diff, is not a plan.
      #
      # requirements.txt is a full freeze (see the groups: comment below), so
      # any minor/patch bump anywhere in it can be the same failure shape
      # again — not just in the two pairs already caught. `ignore` matches by
      # dependency name before `groups` ever runs, so a blanket "*" here is
      # the only way to stop the catch-all without re-typing 50+ package
      # names by hand — and it takes the pydantic and google-stack groups
      # below down WITH it, deliberately: their whole purpose was proposing
      # THOSE minor/patch bumps safely, and there is nothing left for them to
      # do while all minor/patch bumps are blocked. That's an accepted
      # side effect, not an oversight.
      #
      # Does not touch: major-version bumps (never batched here anyway),
      # frontend or github-actions updates (separate ecosystem blocks), or
      # security updates — GitHub raises those independently of `ignore`.
      #
      # Remove this by deleting the entry, once backend dependency updates
      # are being reviewed individually again rather than batch-merged.
      # pydantic and google-stack resume proposing the moment this is gone —
      # their groups were never touched, only starved of anything to group.
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

    groups:
      # ⚠️ THE PINNED SUB-DEPENDENCIES MOVE WITH THEIR PARENTS OR NOT AT ALL.
      #
      # requirements.txt is a full freeze, so it pins pydantic_core and
      # protobuf independently of the packages that require exact versions of
      # them. Grouped updates then bumped a parent and left its child behind,
      # twice, and each time the PR could not install itself:
      #
      #   pydantic 2.13.5 pins pydantic-core 2.46.5; the PR set it to 2.48.0
      #     -> ResolutionImpossible
      #   google-api-core 2.36.0 requires protobuf>=6.33.5; the PR left
      #     protobuf==5.29.6
      #     -> ResolutionImpossible
      #
      # Naming them in the same group is the same fix the next-react group
      # uses for React and its types: things that must move together are
      # offered together, so a version skew cannot be proposed in the first
      # place. This does NOT make the group correct automatically — verify a
      # pip PR with a from-scratch install in a throwaway venv, never against
      # the working one, because pip will have already repaired the venv and
      # the file will still be wrong.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic_core"
          - "pydantic-core"
      google-stack:
        patterns:
          - "google-*"
          - "protobuf"
          - "grpcio*"
          - "proto-plus"
      # There used to be a python-minor-patch group here, matching anything
      # not caught by the two above — see the ignore entry up top for why it
      # was removed rather than kept as a (now permanently empty) group.

  # ─── The workflows themselves ─────────────────────────────────────────────
  # These hold repository secrets (SUPABASE_DB_URL), so a compromised or
  # abandoned action is a credential problem, not just a broken build.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
