# Applies database migrations to PRODUCTION on merge to main.
#
# This runs automatically and without an approval gate, by decision on
# 2026-08-23. There is no staging project and the Supabase Free plan has no
# point-in-time restore, so a migration merged here reaches the live database
# with real users on it. The PR dry run (supabase-migrations-check.yml) is the
# review step -- read its output before merging.
#
# To add a manual gate later: create a GitHub Environment named `production`
# with a required reviewer, then add `environment: production` to the job below.

name: Supabase migrations (deploy)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      # A change to this workflow re-runs the deploy. Without it, fixing the
      # workflow itself could not be exercised without also touching an
      # unrelated migration — which is how a broken deploy stays broken.
      # The dry-run workflow already watches its own path this way.
      - ".github/workflows/supabase-migrations-deploy.yml"
  workflow_dispatch:

# Never let two pushes apply migrations at the same time. `cancel-in-progress`
# is deliberately false: cancelling a half-applied migration run is worse than
# queueing behind it.
concurrency:
  group: supabase-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    # ── Why this variable is here ──────────────────────────────────────
    # supabase/config.toml declares [auth.hook.send_email] with
    # `secrets = "env(SEND_EMAIL_HOOK_SECRET)"`. The CLI VALIDATES that value
    # while loading the config, before it does anything else — so with the
    # variable absent or empty every command fails with:
    #
    #   LegacyDbConfigLoadError: Invalid hook config:
    #   auth.hook.send_email.secrets must be formatted as
    #   "v1,whsec_<base64_encoded_secret>" with a minimum length of 32 characters.
    #
    # That is what broke the deploy on 2026-09-01: `migration list` failed,
    # `db push` was skipped, and no migration reached production.
    #
    # THE PLACEHOLDER IS DELIBERATE — DO NOT REPLACE IT WITH THE REAL SECRET.
    # The hook itself is genuinely live (it sends every signup confirmation
    # and password reset via supabase/functions/send-email), but PRODUCTION's
    # copy is configured in the Supabase Dashboard, and the config.toml block
    # is local-dev only — its uri is host.docker.internal:54321. This job runs
    # `migration list` and `db push`, neither of which invokes the hook or
    # applies auth config. So CI needs a syntactically valid value and nothing
    # more; shipping the real signing secret here would widen its exposure for
    # no functional gain.
    #
    # ⚠️ IF YOU EVER ADD `supabase config push` TO THIS WORKFLOW, STOP.
    # That command WOULD write this value to the project and break every auth
    # email. Set the real secret as a repository secret first — the fallback
    # below picks it up automatically if it exists.
    env:
      SEND_EMAIL_HOOK_SECRET: >-
        ${{ secrets.SEND_EMAIL_HOOK_SECRET ||
            'v1,whsec_Q0ktT05MWS1QTEFDRUhPTERFUi1OT1QtQS1SRUFMLVNFQ1JFVA==' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      # Secrets are read through `env:` rather than interpolated into the
      # script body: `${{ secrets.X }}` is substituted textually before bash
      # sees it, so a value containing shell metacharacters would be parsed
      # as code. Referencing "$VAR" keeps the value data.
      - name: Fail early if the secret is missing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing repository secret: SUPABASE_DB_URL"
            exit 1
          fi

      # Pinned to the version this workflow was written and tested against.
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # --db-url, NOT --linked. `--linked` connects to
      # db.<ref>.supabase.co, which resolves to IPv6 ONLY unless you pay for
      # the IPv4 add-on. GitHub-hosted runners are IPv4-only, so --linked is
      # unreachable from CI and fails with a network error. The session
      # pooler (port 5432) is IPv4 and speaks full SQL including DDL.
      # Do NOT switch this to port 6543: that is transaction mode, which is
      # not safe for migrations.
      - name: Migration state BEFORE
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee /tmp/before.log

      # ── Why the output is re-emitted as ::error:: ──────────────────────
      # A failing step annotates the run with a bare "Process completed with
      # exit code 1" and puts the actual reason only in the raw log, which
      # needs ADMIN rights to read through the API. Echoing the captured
      # output back as an annotation puts the real error where anyone with
      # read access can see it — including on a phone, without opening the
      # run. Redacted first; this repository is public.
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # pipefail so `tee` cannot swallow a non-zero exit and turn a failed
          # deploy into a green tick.
          set -o pipefail
          if ! supabase db push --db-url "$SUPABASE_DB_URL" 2>&1 | tee /tmp/push.log; then
            # Annotations are single-line: %0A is the encoding for a newline,
            # and a literal "::" would terminate the workflow command early.
            MSG=$(sed -E \
                    -e 's#(postgres(ql)?://)[^[:space:]]*#\1REDACTED#g' \
                    -e 's#(:)[^:@/[:space:]]+(@)#\1REDACTED\2#g' \
                    -e 's#::#;;#g' \
                    /tmp/push.log | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=supabase db push failed::${MSG}"
            exit 1
          fi

      # Runs even on failure, so a partial apply is visible in the log rather
      # than leaving you guessing which migrations landed.
      - name: Migration state AFTER
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee /tmp/after.log
          # Which migrations actually landed, as an annotation — the single
          # most useful fact after a partial or failed deploy.
          MSG=$(sed -E -e 's#(postgres(ql)?://)[^[:space:]]*#\1REDACTED#g' -e 's#::#;;#g' \
                  /tmp/after.log | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Migration state after deploy::${MSG}"

      # ── Why the output is copied into the job summary ──────────────────
      # Reading a workflow's raw logs through the API needs admin rights on
      # the repository, so a deploy failure could only be diagnosed by a human
      # opening the run in a browser. The job summary is part of the check
      # run, which is readable by anyone who can read the repo — so putting
      # the deploy output here makes a failure diagnosable without special
      # access, and preserves the psql NOTICEs (the default-privileges
      # migration reports through those) rather than burying them.
      #
      # ⚠️ THIS REPOSITORY IS PUBLIC AND SO IS THIS SUMMARY. Everything
      # written here is scrubbed of anything shaped like a connection string
      # first. Do not add raw environment dumps to it.
      - name: Publish the deploy output to the job summary
        if: always()
        run: |
          redact() {
            [ -f "$1" ] || { echo "(no output captured)"; return; }
            sed -E \
              -e 's#(postgres(ql)?://)[^[:space:]]*#\1REDACTED#g' \
              -e 's#(:)[^:@/[:space:]]+(@)#\1REDACTED\2#g' \
              "$1" | tail -120
          }
          {
            echo "## Supabase migration deploy"
            echo ""
            echo "### Before"
            echo '```'; redact /tmp/before.log; echo '```'
            echo "### db push"
            echo '```'; redact /tmp/push.log;   echo '```'
            echo "### After"
            echo '```'; redact /tmp/after.log;  echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
