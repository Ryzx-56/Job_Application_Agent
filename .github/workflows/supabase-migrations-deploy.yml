# Applies database migrations to PRODUCTION on merge to main.
#
# This runs automatically and without an approval gate, by decision on
# 2026-08-23. There is no staging project and the Supabase Free plan has no
# point-in-time restore, so a migration merged here reaches the live database
# with real users on it. The PR dry run (supabase-migrations-check.yml) is the
# review step -- read its output before merging.
#
# To add a manual gate later: create a GitHub Environment named `production`
# with a required reviewer, then add `environment: production` to the job below.

name: Supabase migrations (deploy)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      # A change to this workflow re-runs the deploy. Without it, fixing the
      # workflow itself could not be exercised without also touching an
      # unrelated migration — which is how a broken deploy stays broken.
      # The dry-run workflow already watches its own path this way.
      - ".github/workflows/supabase-migrations-deploy.yml"
  workflow_dispatch:

# Never let two pushes apply migrations at the same time. `cancel-in-progress`
# is deliberately false: cancelling a half-applied migration run is worse than
# queueing behind it.
concurrency:
  group: supabase-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    # ── Why this variable is here ──────────────────────────────────────
    # supabase/config.toml declares [auth.hook.send_email] with
    # `secrets = "env(SEND_EMAIL_HOOK_SECRET)"`. The CLI VALIDATES that value
    # while loading the config, before it does anything else — so with the
    # variable absent or empty every command fails with:
    #
    #   LegacyDbConfigLoadError: Invalid hook config:
    #   auth.hook.send_email.secrets must be formatted as
    #   "v1,whsec_<base64_encoded_secret>" with a minimum length of 32 characters.
    #
    # That is what broke the deploy on 2026-09-01: `migration list` failed,
    # `db push` was skipped, and no migration reached production.
    #
    # THE PLACEHOLDER IS DELIBERATE — DO NOT REPLACE IT WITH THE REAL SECRET.
    # The hook itself is genuinely live (it sends every signup confirmation
    # and password reset via supabase/functions/send-email), but PRODUCTION's
    # copy is configured in the Supabase Dashboard, and the config.toml block
    # is local-dev only — its uri is host.docker.internal:54321. This job runs
    # `migration list` and `db push`, neither of which invokes the hook or
    # applies auth config. So CI needs a syntactically valid value and nothing
    # more; shipping the real signing secret here would widen its exposure for
    # no functional gain.
    #
    # ⚠️ IF YOU EVER ADD `supabase config push` TO THIS WORKFLOW, STOP.
    # That command WOULD write this value to the project and break every auth
    # email. Set the real secret as a repository secret first — the fallback
    # below picks it up automatically if it exists.
    env:
      SEND_EMAIL_HOOK_SECRET: >-
        ${{ secrets.SEND_EMAIL_HOOK_SECRET ||
            'v1,whsec_Q0ktT05MWS1QTEFDRUhPTERFUi1OT1QtQS1SRUFMLVNFQ1JFVA==' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7

      # Secrets are read through `env:` rather than interpolated into the
      # script body: `${{ secrets.X }}` is substituted textually before bash
      # sees it, so a value containing shell metacharacters would be parsed
      # as code. Referencing "$VAR" keeps the value data.
      - name: Fail early if the secret is missing
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing repository secret: SUPABASE_DB_URL"
            exit 1
          fi

          # ── The secret must be the SESSION POOLER, not the direct host ──
          # db.<ref>.supabase.co is IPv6-only unless the IPv4 add-on is paid
          # for, and GitHub-hosted runners are IPv4-only — so a direct URL
          # fails with "Network is unreachable". This is stated at the top of
          # the file, but it was still what the secret contained, and the
          # failure only surfaced once the host stopped answering on IPv4:
          # three deploys passed, then every one after failed, with nothing
          # in between to explain it.
          #
          # Checked here so the run says WHY in one line instead of leaving a
          # network error to be interpreted.
          case "$SUPABASE_DB_URL" in
            *db.*.supabase.co*)
              echo "::error title=SUPABASE_DB_URL points at the direct host::The secret uses db.<ref>.supabase.co, which is IPv6-only without the paid IPv4 add-on, and GitHub runners are IPv4-only. Use the SESSION POOLER string from Supabase → Project Settings → Database → Connection string → Session pooler. It looks like postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres — port 5432 (session mode), NOT 6543 (transaction mode), which cannot run DDL."
              exit 1
              ;;
          esac

      # ── What shape is the connection string, actually? ────────────────
      # "Failed to connect" from the CLI is a wrapper message; it does not say
      # whether the URL even parsed, whether the username is the one the
      # pooler requires, or whether an unencoded character in the password
      # silently truncated the host. This answers all three BEFORE the CLI
      # runs, so a failure downstream can be attributed instead of guessed at.
      #
      # NOTHING SECRET IS PRINTED. The password is never echoed, and the
      # characters inside it are reported only as a COUNT of how many would
      # need percent-encoding — this repository is public and annotations are
      # world-readable.
      - name: Inspect the connection string shape
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlsplit, unquote

          raw = os.environ.get("SUPABASE_DB_URL", "")
          url = raw.strip().strip('\r\n\t')
          notes = []

          if raw != url:
              notes.append(f"WHITESPACE: the secret has {len(raw)-len(url)} stray character(s) around it "
                           "(a pasted value usually picks up a trailing newline). The job trims it, "
                           "but fix the secret.")

          # An unencoded '@' inside the password is the classic silent
          # breakage: urlsplit splits on the LAST '@', so the host becomes
          # whatever followed the real one and the error looks like DNS.
          at = url.count("@")
          if at != 1:
              notes.append(f"AT-SIGNS: found {at} '@' in the URL, expected exactly 1. "
                           "More than one means the password contains an unencoded '@', which moves "
                           "where the host starts and makes this look like a connectivity problem.")

          try:
              u = urlsplit(url)
          except Exception as e:
              print(f"::error title=Connection string does not parse::{e}")
              sys.exit(0)

          host, port, user = u.hostname, u.port, u.username or ""
          db = (u.path or "").lstrip("/")

          print(f"scheme   : {u.scheme}")
          print(f"host     : {host}")
          print(f"port     : {port}")
          print(f"database : {db}")

          # ── Username: the pooler needs postgres.<project-ref> ───────────
          pooler = bool(host and "pooler.supabase.com" in host)
          tenant = bool(re.fullmatch(r"postgres\.[a-z0-9]{16,}", user or ""))
          print(f"username : {'postgres.<ref> (correct for the pooler)' if tenant else repr(user)}")
          if pooler and not tenant:
              notes.append("USERNAME: the host is the pooler but the username is not "
                           "postgres.<project-ref>. The pooler routes by tenant embedded in the "
                           "username, so a bare 'postgres' is rejected — usually as "
                           "'Tenant or user not found', which reads like a credentials problem.")
          if not pooler and tenant:
              notes.append("USERNAME: username is postgres.<ref> but the host is not the pooler. "
                           "The direct host expects a bare 'postgres'.")

          # ── Port: session vs transaction mode ───────────────────────────
          if pooler and port == 6543:
              notes.append("PORT: 6543 is TRANSACTION mode, which cannot run DDL. "
                           "Migrations need 5432 (session mode).")
          elif pooler and port != 5432:
              notes.append(f"PORT: {port} is unexpected for the session pooler (expected 5432).")

          # ── Password: only a count, never the value ─────────────────────
          pw = u.password or ""
          decoded = unquote(pw)
          reserved = sum(1 for c in decoded if c in "@/:?#[]% ")
          print(f"password : {len(decoded)} chars, {reserved} of which require percent-encoding")
          if reserved and pw == decoded:
              notes.append(f"PASSWORD: {reserved} character(s) need percent-encoding and the value "
                           "appears not to be encoded (it is unchanged by unquote). Re-copy the "
                           "string from the Supabase dashboard, which encodes it for you, or encode "
                           "manually: @ -> %40, / -> %2F, : -> %3A, # -> %23, ? -> %3F, % -> %25.")

          if notes:
              joined = "%0A".join("- " + n for n in notes)
              print(f"::warning title=Connection string has {len(notes)} problem(s)::{joined}")
          else:
              print("::notice title=Connection string shape looks correct::"
                    "Session pooler host, postgres.<ref> username, port 5432, password encoded, "
                    "no stray whitespace. A failure after this is not the URL's shape.")
          PY

      # Pinned to the version this workflow was written and tested against.
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # --db-url, NOT --linked. `--linked` connects to
      # db.<ref>.supabase.co, which resolves to IPv6 ONLY unless you pay for
      # the IPv4 add-on. GitHub-hosted runners are IPv4-only, so --linked is
      # unreachable from CI and fails with a network error. The session
      # pooler (port 5432) is IPv4 and speaks full SQL including DDL.
      # Do NOT switch this to port 6543: that is transaction mode, which is
      # not safe for migrations.
      - name: Migration state BEFORE
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          # ── The secret has a stray control character in it ──────────────
          # The 2026-09-01 deploys failed here with:
          #   failed to parse connection string ... invalid control character in URL
          # A pasted secret picks up a trailing newline easily, and a valid
          # Postgres URL never contains one, nor leading/trailing whitespace —
          # so trimming is safe and makes the job survive a secret that was
          # entered with one. FIX THE SECRET TOO; this is a seatbelt, not a
          # substitute.
          #
          # add-mask registers the trimmed value for redaction: GitHub only
          # masks the EXACT secret string, and a trimmed copy is a different
          # string that would otherwise print in the clear.
          DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n\t' | sed -e 's/^ *//' -e 's/ *$//')
          echo "::add-mask::$DB_URL"
          supabase migration list --debug --db-url "$DB_URL" 2>&1 | tee /tmp/before.log

      # ── Why the output is re-emitted as ::error:: ──────────────────────
      # A failing step annotates the run with a bare "Process completed with
      # exit code 1" and puts the actual reason only in the raw log, which
      # needs ADMIN rights to read through the API. Echoing the captured
      # output back as an annotation puts the real error where anyone with
      # read access can see it — including on a phone, without opening the
      # run. Redacted first; this repository is public.
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # pipefail so `tee` cannot swallow a non-zero exit and turn a failed
          # deploy into a green tick.
          set -o pipefail
          # ── The secret has a stray control character in it ──────────────
          # The 2026-09-01 deploys failed here with:
          #   failed to parse connection string ... invalid control character in URL
          # A pasted secret picks up a trailing newline easily, and a valid
          # Postgres URL never contains one, nor leading/trailing whitespace —
          # so trimming is safe and makes the job survive a secret that was
          # entered with one. FIX THE SECRET TOO; this is a seatbelt, not a
          # substitute.
          #
          # add-mask registers the trimmed value for redaction: GitHub only
          # masks the EXACT secret string, and a trimmed copy is a different
          # string that would otherwise print in the clear.
          DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n\t' | sed -e 's/^ *//' -e 's/ *$//')
          echo "::add-mask::$DB_URL"
          if ! supabase db push --debug --db-url "$DB_URL" 2>&1 | tee /tmp/push.log; then
            # Annotations are single-line: %0A is the encoding for a newline,
            # and a literal "::" would terminate the workflow command early.
            MSG=$(sed -E \
                    -e 's#(postgres(ql)?://)[^[:space:]]*#\1REDACTED#g' \
                    -e 's#(:)[^:@/[:space:]]+(@)#\1REDACTED\2#g' \
                    -e 's#::#;;#g' \
                    /tmp/push.log | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=supabase db push failed::${MSG}"
            exit 1
          fi

      # Runs even on failure, so a partial apply is visible in the log rather
      # than leaving you guessing which migrations landed.
      - name: Migration state AFTER
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          # ── The secret has a stray control character in it ──────────────
          # The 2026-09-01 deploys failed here with:
          #   failed to parse connection string ... invalid control character in URL
          # A pasted secret picks up a trailing newline easily, and a valid
          # Postgres URL never contains one, nor leading/trailing whitespace —
          # so trimming is safe and makes the job survive a secret that was
          # entered with one. FIX THE SECRET TOO; this is a seatbelt, not a
          # substitute.
          #
          # add-mask registers the trimmed value for redaction: GitHub only
          # masks the EXACT secret string, and a trimmed copy is a different
          # string that would otherwise print in the clear.
          DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n\t' | sed -e 's/^ *//' -e 's/ *$//')
          echo "::add-mask::$DB_URL"
          supabase migration list --debug --db-url "$DB_URL" 2>&1 | tee /tmp/after.log
          # Which migrations actually landed, as an annotation — the single
          # most useful fact after a partial or failed deploy.
          MSG=$(sed -E -e 's#(postgres(ql)?://)[^[:space:]]*#\1REDACTED#g' -e 's#::#;;#g' \
                  /tmp/after.log | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Migration state after deploy::${MSG}"

      # ── Post-deploy security assertion ────────────────────────────────
      # 20260901120344_default_privileges_deny_by_default.sql tightens the
      # default privileges so a newly created table is not automatically
      # granted to anon/authenticated. It has to do that for TWO owning roles,
      # and ALTER DEFAULT PRIVILEGES FOR ROLE X requires membership in X — CI
      # connects as postgres, which on Supabase may not be a member of
      # supabase_admin. The migration catches that and warns rather than
      # failing, so the warning is easy to miss and it only appears in the raw
      # log, which needs admin rights to read.
      #
      # This asserts the END STATE instead, which is what actually matters:
      # if anon or authenticated still appear in the default ACLs for public,
      # the hardening did not fully take and new tables are still being
      # granted to browser roles.
      - name: Verify default privileges took effect
        if: always()
        # A diagnostic must never be the reason a deploy goes red, and its
        # output must never be mistaken for a result when the query did not
        # actually run — see the connection guard below.
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n\t' | sed -e 's/^ *//' -e 's/ *$//')
          echo "::add-mask::$DB_URL"
          if ! OUT=$(psql "$DB_URL" -At -F'|' -c "
            SELECT r.rolname,
                   a.defaclobjtype,
                   coalesce(array_to_string(a.defaclacl, ' '), '(none)')
            FROM pg_default_acl a
            JOIN pg_roles r     ON r.oid = a.defaclrole
            JOIN pg_namespace n ON n.oid = a.defaclnamespace
            WHERE n.nspname = 'public'
            ORDER BY 1, 2;" 2>&1); then
            # psql failed — that is a CONNECTIVITY result, not a privilege
            # result. Reporting it as one is how "could not connect" gets
            # rendered as "2 objects are exposed".
            echo "::warning title=Privilege verification could not run::$(printf '%s' "$OUT" | sed 's#::#;;#g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 0
          fi
          OUT=$(printf '%s' "$OUT" | sed 's#::#;;#g')
          LEAKY=$(printf '%s' "$OUT" | grep -cE '(^|[ =])(anon|authenticated)=' || true)
          MSG=$(printf '%s' "$OUT" | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Default ACLs in public (browser-role grants: ${LEAKY})::${MSG}"

          # ── Ownership inventory ────────────────────────────────────────
          # supabase_admin's default-privilege TEMPLATE cannot be altered on
          # this platform: postgres is not a member of supabase_admin, so the
          # ALTER is refused from CI *and* from the Dashboard SQL editor. That
          # template only applies to objects supabase_admin CREATES, which in
          # practice means tables made by hand in the Dashboard Table Editor —
          # everything built through a migration is owned by postgres and is
          # already locked down.
          #
          # So the remaining exposure is not theoretical, it is a specific
          # list of objects. This prints it on every deploy, which also turns
          # the "always add tables via a migration" rule into something
          # observable rather than something people have to remember.
          # Relations AND sequences AND functions: the default-privilege
          # template has a separate entry for each of those three object
          # types, so an inventory that only looked at tables would report
          # "clean" while a sequence or function sat there granted to anon.
          if ! OWN=$(psql "$DB_URL" -At -F'|' -c "
            SELECT r.rolname, c.relkind::text, c.relname,
                   coalesce(array_to_string(c.relacl, ' '), '(owner default)')
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_roles r     ON r.oid = c.relowner
            WHERE n.nspname = 'public'
              AND c.relkind IN ('r','p','v','m','S')
              AND r.rolname <> 'postgres'
            UNION ALL
            SELECT r.rolname, 'func', p.proname,
                   coalesce(array_to_string(p.proacl, ' '), '(owner default)')
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            JOIN pg_roles r     ON r.oid = p.proowner
            WHERE n.nspname = 'public'
              AND r.rolname <> 'postgres'
            ORDER BY 1, 2, 3;" 2>&1); then
            echo "::warning title=Ownership inventory could not run::$(printf '%s' "$OWN" | sed 's#::#;;#g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 0
          fi
          OWN=$(printf '%s' "$OWN" | sed 's#::#;;#g')
          if [ -z "$OWN" ]; then
            echo "::notice title=Object ownership in public (non-postgres owners: 0)::Every table, view, sequence and function in public is owned by postgres, so the default-privilege hardening that DID apply covers all of them. supabase_admin owns nothing here, so its unalterable template governs nothing."
          else
            COUNT=$(printf '%s' "$OWN" | grep -c . || true)
            OWNMSG=$(printf '%s' "$OWN" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=Objects in public NOT owned by postgres (${COUNT})::${OWNMSG}"
          fi

      # ── Why the output is copied into the job summary ──────────────────
      # Reading a workflow's raw logs through the API needs admin rights on
      # the repository, so a deploy failure could only be diagnosed by a human
      # opening the run in a browser. The job summary is part of the check
      # run, which is readable by anyone who can read the repo — so putting
      # the deploy output here makes a failure diagnosable without special
      # access, and preserves the psql NOTICEs (the default-privileges
      # migration reports through those) rather than burying them.
      #
      # ⚠️ THIS REPOSITORY IS PUBLIC AND SO IS THIS SUMMARY. Everything
      # written here is scrubbed of anything shaped like a connection string
      # first. Do not add raw environment dumps to it.
      - name: Publish the deploy output to the job summary
        if: always()
        run: |
          redact() {
            [ -f "$1" ] || { echo "(no output captured)"; return; }
            sed -E \
              -e 's#(postgres(ql)?://)[^[:space:]]*#\1REDACTED#g' \
              -e 's#(:)[^:@/[:space:]]+(@)#\1REDACTED\2#g' \
              "$1" | tail -120
          }
          {
            echo "## Supabase migration deploy"
            echo ""
            echo "### Before"
            echo '```'; redact /tmp/before.log; echo '```'
            echo "### db push"
            echo '```'; redact /tmp/push.log;   echo '```'
            echo "### After"
            echo '```'; redact /tmp/after.log;  echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
