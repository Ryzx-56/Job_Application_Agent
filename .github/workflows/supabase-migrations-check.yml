# Dry-run gate for database migrations.
#
# Runs on any PR that touches supabase/migrations/ and prints exactly what
# `db push` WOULD apply, without applying it. Because deploys to production are
# fully automatic on merge to main (see supabase-migrations-deploy.yml), and
# because the Supabase Free plan has no point-in-time restore, this dry-run
# output is the only review step between a migration and production. Read it.
#
# Note on secrets: this repo is public. GitHub does not expose secrets to
# `pull_request` runs originating from a FORK, so this job will skip rather
# than fail for outside contributions. PRs from branches in this repo get
# secrets normally.

name: Supabase migrations (dry run)

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations-*.yml"

concurrency:
  group: supabase-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Preview pending migrations
    runs-on: ubuntu-latest
    # ── Why this variable is here ──────────────────────────────────────
    # supabase/config.toml declares [auth.hook.send_email] with
    # `secrets = "env(SEND_EMAIL_HOOK_SECRET)"`. The CLI VALIDATES that value
    # while loading the config, before it does anything else — so with the
    # variable absent or empty every command fails with:
    #
    #   LegacyDbConfigLoadError: Invalid hook config:
    #   auth.hook.send_email.secrets must be formatted as
    #   "v1,whsec_<base64_encoded_secret>" with a minimum length of 32 characters.
    #
    # That is what broke the deploy on 2026-09-01: `migration list` failed,
    # `db push` was skipped, and no migration reached production.
    #
    # THE PLACEHOLDER IS DELIBERATE — DO NOT REPLACE IT WITH THE REAL SECRET.
    # The hook itself is genuinely live (it sends every signup confirmation
    # and password reset via supabase/functions/send-email), but PRODUCTION's
    # copy is configured in the Supabase Dashboard, and the config.toml block
    # is local-dev only — its uri is host.docker.internal:54321. This job runs
    # `migration list` and `db push`, neither of which invokes the hook or
    # applies auth config. So CI needs a syntactically valid value and nothing
    # more; shipping the real signing secret here would widen its exposure for
    # no functional gain.
    #
    # ⚠️ IF YOU EVER ADD `supabase config push` TO THIS WORKFLOW, STOP.
    # That command WOULD write this value to the project and break every auth
    # email. Set the real secret as a repository secret first — the fallback
    # below picks it up automatically if it exists.
    env:
      SEND_EMAIL_HOOK_SECRET: >-
        ${{ secrets.SEND_EMAIL_HOOK_SECRET ||
            'v1,whsec_Q0ktT05MWS1QTEFDRUhPTERFUi1OT1QtQS1SRUFMLVNFQ1JFVA==' }}

    steps:
      - name: Check out the PR
        uses: actions/checkout@v4

      # Read through `env:` rather than interpolated into the script body --
      # `${{ secrets.X }}` is substituted textually before bash sees it, so a
      # value with shell metacharacters would be parsed as code.
      - name: Are secrets available to this run?
        id: guard
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets are not available (likely a fork PR). Skipping the dry run."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned, not `latest`. An unpinned CLI means a release upstream can
      # change behaviour on a workflow that writes to production.
      - name: Install the Supabase CLI
        if: steps.guard.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # --db-url, NOT --linked. `--linked` connects to db.<ref>.supabase.co,
      # which resolves to IPv6 ONLY unless you pay for the IPv4 add-on.
      # GitHub-hosted runners are IPv4-only, so --linked is unreachable from
      # CI. The session pooler (port 5432) is IPv4 and speaks full SQL
      # including DDL. Do NOT switch to port 6543 (transaction mode).
      - name: List migrations already applied to production
        if: steps.guard.outputs.available == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # The SUPABASE_DB_URL secret was entered with a trailing control
          # character, which made `db push` fail with "invalid control
          # character in URL". A valid Postgres URL never contains one, so
          # trimming is safe. add-mask registers the trimmed value for log
          # redaction — GitHub only masks the EXACT secret string, and a
          # trimmed copy is a different string.
          DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n\t' | sed -e 's/^ *//' -e 's/ *$//')
          echo "::add-mask::$DB_URL"
          supabase migration list --db-url "$DB_URL"

      - name: Dry run - what WOULD be applied
        if: steps.guard.outputs.available == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # The SUPABASE_DB_URL secret was entered with a trailing control
          # character, which made `db push` fail with "invalid control
          # character in URL". A valid Postgres URL never contains one, so
          # trimming is safe. add-mask registers the trimmed value for log
          # redaction — GitHub only masks the EXACT secret string, and a
          # trimmed copy is a different string.
          DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n\t' | sed -e 's/^ *//' -e 's/ *$//')
          echo "::add-mask::$DB_URL"
          supabase db push --dry-run --db-url "$DB_URL"
