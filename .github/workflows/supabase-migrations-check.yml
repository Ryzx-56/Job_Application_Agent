# Dry-run gate for database migrations.
#
# Runs on any PR that touches supabase/migrations/ and prints exactly what
# `db push` WOULD apply, without applying it. Because deploys to production are
# fully automatic on merge to main (see supabase-migrations-deploy.yml), and
# because the Supabase Free plan has no point-in-time restore, this dry-run
# output is the only review step between a migration and production. Read it.
#
# Note on secrets: this repo is public. GitHub does not expose secrets to
# `pull_request` runs originating from a FORK, so this job will skip rather
# than fail for outside contributions. PRs from branches in this repo get
# secrets normally.

name: Supabase migrations (dry run)

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations-*.yml"

concurrency:
  group: supabase-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Preview pending migrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4

      # Read through `env:` rather than interpolated into the script body --
      # `${{ secrets.X }}` is substituted textually before bash sees it, so a
      # value with shell metacharacters would be parsed as code.
      - name: Are secrets available to this run?
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets are not available (likely a fork PR). Skipping the dry run."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned, not `latest`. An unpinned CLI means a release upstream can
      # change behaviour on a workflow that writes to production.
      - name: Install the Supabase CLI
        if: steps.guard.outputs.available == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link the project
        if: steps.guard.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: List migrations already applied to production
        if: steps.guard.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Dry run - what WOULD be applied
        if: steps.guard.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run
